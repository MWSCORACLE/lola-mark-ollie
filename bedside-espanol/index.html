<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedside Español</title>
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bedside">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --vp-narrow:375px;--vp-medium:768px;--vp-wide:1280px;
  --bg:#FFFFFF;--soft:#F7F7F7;--text:#3C3C3C;--muted:#6E6E6E;--line:#E5E5E5;
  --lock:#E5E5E5;--lock-d:#CECECE;--hint:#AFAFAF;
  --green:#58CC02;--green-l:#D7FFB8;--green-t:#3F7D00;
  --red-l:#FFDFE0;--red-t:#B71C1C;
  --blue:#1CB0F6;--blue-l:#DDF4FF;--blue-t:#0F6E9C;
  --tip-bg:#FFF4CC;--tip-tx:#5B4500;
  --orange-t:#C46A00;
  --focus:#1899D6;
  --overlay:rgba(0,0,0,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131F24;--soft:#1B2A31;--text:#E8F1F5;--muted:#A7B6BE;--line:#37464F;
    --lock:#37464F;--lock-d:#26333A;--hint:#6B7D87;
    --green-l:#1D3A0E;--green-t:#8FE02A;--red-l:#3F1D20;--red-t:#FF9A9A;
    --blue-l:#10303F;--blue-t:#6CCBF5;--tip-bg:#3A3112;--tip-tx:#FFE08A;
    --orange-t:#FFB347;--focus:#6CCBF5;--overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#131F24;--soft:#1B2A31;--text:#E8F1F5;--muted:#A7B6BE;--line:#37464F;
  --lock:#37464F;--lock-d:#26333A;--hint:#6B7D87;
  --green-l:#1D3A0E;--green-t:#8FE02A;--red-l:#3F1D20;--red-t:#FF9A9A;
  --blue-l:#10303F;--blue-t:#6CCBF5;--tip-bg:#3A3112;--tip-tx:#FFE08A;
  --orange-t:#FFB347;--focus:#6CCBF5;--overlay:rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Nunito","Avenir Next Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:700;font-size:17px;line-height:1.35}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--bg);border:2px solid var(--focus);border-radius:12px;padding:10px 14px;color:var(--text)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.ic{width:24px;height:24px;flex:none;display:block}

/* ---------- shell ---------- */
.app{width:100%;min-height:100vh}
.stage{min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
main.page{width:100%;max-width:560px;margin-inline:auto;padding:0 16px 32px}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
.lang-badge{width:36px;height:36px;border-radius:50%;background:var(--blue-l);border:2px solid var(--blue);color:var(--blue-t);display:grid;place-items:center;font-size:13px;font-weight:900}
.stats{display:flex;gap:18px}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;min-height:44px}
.stat .ic{width:26px;height:26px}
.s-fire b{color:var(--orange-t)}
.s-xp b{color:var(--blue-t)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:4px;
  background:var(--bg);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .brand{display:none}
.nav button{flex:1;max-width:120px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:transparent;border:2px solid transparent;border-radius:14px;color:var(--muted);font-size:12px;font-weight:800}
.nav button .ic{width:28px;height:28px}
.nav button[aria-current="page"]{background:var(--blue-l);border-color:var(--blue);color:var(--blue-t)}
@media (min-width:768px){
  .nav{top:0;bottom:0;right:auto;width:240px;flex-direction:column;justify-content:flex-start;gap:6px;
    border-top:0;border-right:2px solid var(--line);padding:24px 14px}
  .nav .brand{display:block;font-size:30px;font-weight:900;color:var(--green);letter-spacing:-.01em;padding:0 14px 18px;line-height:1.05}
  .nav button{flex:none;max-width:none;width:100%;flex-direction:row;justify-content:flex-start;gap:16px;padding:0 14px;
    font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .stage{margin-left:240px;padding-bottom:40px}
}

/* ---------- buttons ---------- */
.btn{--b:#46A302;--bs:#2F7A00;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 22px;
  border:0;border-radius:16px;background:var(--b);color:#fff;box-shadow:0 4px 0 var(--bs);
  font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--bs)}
.btn[disabled]{background:var(--lock);color:var(--hint);box-shadow:none;cursor:not-allowed;filter:none;transform:none}
.btn-blue{--b:#1899D6;--bs:#12749F}
.btn-red{--b:#EA2B2B;--bs:#B71C1C}
.btn-ghost{background:var(--bg);color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-ghost:active{box-shadow:0 0 0 var(--line)}
.btn-danger-o{background:var(--bg);color:var(--red-t);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-sm{min-height:44px;padding:10px 16px;font-size:14px}
.spk{width:48px;height:48px;flex:none;display:grid;place-items:center;border:0;border-radius:14px;background:#1899D6;color:#fff;box-shadow:0 4px 0 #12749F}
.spk:active{transform:translateY(4px);box-shadow:0 0 0 #12749F}
.spk .ic{width:26px;height:26px}
.slow{min-height:44px;padding:0 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--blue-t);font-weight:900;font-size:14px}

/* ---------- learn path ---------- */
.unit{--ub:#46A302;--ubs:#2F7A00;--u:#58CC02;--ud:#46A302}
.unit.blue{--ub:#1899D6;--ubs:#12749F;--u:#1CB0F6;--ud:#1899D6}
.unit.purple{--ub:#A560E8;--ubs:#7D3FBF;--u:#CE82FF;--ud:#A560E8}
.banner{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--ub);color:#fff;border-radius:18px;padding:16px 14px 16px 20px;box-shadow:0 4px 0 var(--ubs)}
.kicker{font-size:15px;font-weight:800}
.banner h2{font-size:22px;font-weight:900;line-height:1.15;margin-top:2px}
.ban-sub{font-size:15px;font-weight:700;margin-top:4px}
.btn-g{min-height:48px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:0;border-radius:14px;
  background:var(--ubs);color:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn-g:active{transform:translateY(3px);box-shadow:none}
.btn-g .ic{width:22px;height:22px}
.path{list-style:none;margin:0;padding:8px 0 12px}
.step{display:flex;flex-direction:column;align-items:center;margin:20px 0}
.step.cur{margin-top:60px}
.step-body{transform:translateX(var(--dx));display:flex;flex-direction:column;align-items:center;position:relative}
.node{width:80px;height:72px;border:0;border-radius:50%;background:var(--u);color:#fff;box-shadow:0 8px 0 var(--ud);
  display:grid;place-items:center;position:relative}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ud)}
.node .ic{width:36px;height:36px}
.node.done{background:#FFC800;box-shadow:0 8px 0 #E5A400}
.node.done:active{box-shadow:0 2px 0 #E5A400}
.node.locked{background:var(--lock);box-shadow:0 8px 0 var(--lock-d);color:var(--hint)}
.node.locked:active{box-shadow:0 2px 0 var(--lock-d)}
.step-label{display:block;margin-top:18px;max-width:150px;text-align:center;font-size:14px;font-weight:800;color:var(--muted);line-height:1.2}
.bubble{position:absolute;top:-50px;left:50%;transform:translateX(-50%);background:var(--bg);border:2px solid var(--line);
  border-radius:12px;padding:6px 14px;color:var(--ub);font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--bg);
  border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.pop{width:min(320px,100%);margin:18px auto 0;border-radius:18px;padding:16px;text-align:center;background:var(--ub);color:#fff;animation:rise .18s ease-out}
.pop[hidden]{display:none}
.pop.locked{background:var(--lock);color:var(--muted)}
.pop-t{font-size:20px;font-weight:900;line-height:1.15}
.pop-s{font-size:15px;font-weight:700;margin-top:4px}
.pop .btn{width:100%;margin-top:14px;background:#fff;color:var(--ub);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.pop .btn[disabled]{background:var(--soft);color:var(--hint);box-shadow:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- glossary / profile / shared page bits ---------- */
.h1{font-size:28px;font-weight:900;margin-top:24px}
.lede{color:var(--muted);margin-top:6px;font-size:16px;max-width:60ch}
.field{display:block;margin:18px 0 12px}
.field label{display:block;font-weight:800;font-size:15px;color:var(--muted);margin-bottom:6px}
.sw{position:relative}
.sw .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--hint);pointer-events:none}
input[type=search]{width:100%;min-height:52px;padding:12px 16px 12px 46px;border:2px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700;font-size:17px}
input[type=search]:focus-visible{border-color:var(--focus);outline-offset:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:44px;padding:0 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--muted);font-weight:800;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue-t)}
.count{color:var(--muted);font-size:15px;margin:2px 0 6px}
.term{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:2px solid var(--line)}
.t-es{font-size:19px;font-weight:900;line-height:1.2}
.t-en{color:var(--muted);font-size:16px;margin-top:2px}
.empty{text-align:center;padding:36px 8px}
.empty h2{font-size:21px;font-weight:900}
.empty p{color:var(--muted);margin:6px 0 18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.card .ic{width:30px;height:30px}
.card b{font-size:24px;font-weight:900}
.card span{color:var(--muted);font-size:15px}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:28px auto 0}
.avatar .ic{width:54px;height:54px}
.center{text-align:center}
.mt{margin-top:24px}

/* ---------- overlays: lesson + guide ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto}
.overlay[hidden]{display:none}
.l-top{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:env(safe-area-inset-top,0px)}
.l-top-in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.icon-btn{width:48px;height:48px;flex:none;display:grid;place-items:center;border:0;background:transparent;color:var(--hint);border-radius:14px}
.icon-btn:hover{color:var(--muted)}
.icon-btn .ic{width:28px;height:28px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--lock);overflow:hidden}
.bar-fill{height:100%;width:0;background:var(--green);border-radius:99px;position:relative;transition:width .35s ease}
.bar-fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.4)}
.hearts{display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;color:var(--red-t);min-width:56px;justify-content:flex-end}
.hearts .ic{width:28px;height:28px}
.l-body{width:100%;max-width:680px;margin:0 auto;padding:12px 16px 240px;flex:1}
.q{font-size:26px;font-weight:900;line-height:1.2;margin:8px 0 22px}
.q:focus{outline:none}
.prompt{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
.thumb{flex:none;width:116px;height:87px;border-radius:18px;overflow:hidden;background:var(--soft)}
.thumb svg{display:block;width:100%;height:100%}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.audio{display:flex;gap:10px;align-items:center}
.say-t{position:relative;width:100%;border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:20px;font-weight:800;line-height:1.3}
.say-t::before{content:"";position:absolute;left:-9px;top:26px;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.prompt>.audio:only-child{margin-bottom:0}
.ans{min-height:128px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 0 12px;margin-bottom:26px;
  background:
   linear-gradient(var(--line),var(--line)) 0 61px/100% 2px no-repeat,
   linear-gradient(var(--line),var(--line)) 0 118px/100% 2px no-repeat;
  border-top:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{min-height:48px;padding:10px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);
  font-weight:800;font-size:18px;color:var(--text)}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile.ghost{background:var(--lock);border-color:var(--lock);color:transparent;border-bottom-width:4px;user-select:none}
.tile[disabled]{cursor:default}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.opts{grid-template-columns:1fr}.opts.pics{grid-template-columns:1fr 1fr}}
.opt.pic{position:relative;flex-direction:column;justify-content:center;gap:8px;min-height:138px;text-align:center}
.opt.pic .key{position:absolute;top:8px;right:8px}
.emo{font-size:54px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cap{font-size:15px;font-weight:800;line-height:1.2;color:var(--muted)}
.opt.pic{min-height:124px}
/* scenarios */
.sit{width:100%;border-radius:16px;background:var(--soft);padding:12px 14px;font-size:16px;font-weight:700;line-height:1.35;color:var(--muted)}
.sit b{color:var(--text);font-weight:900}
.hint-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.hw{min-height:44px;padding:8px 12px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);font-weight:800;font-size:15px;color:var(--muted);text-align:left}
.hw .hs{display:none;color:var(--blue-t)}
.hw[aria-pressed="true"]{border-style:solid;border-color:var(--blue);background:var(--blue-l);color:var(--muted)}
.hw[aria-pressed="true"] .hs{display:inline}
.hw[aria-pressed="true"] .hs::before{content:" → "}
.hint-lbl{color:var(--muted);font-size:14px;margin:0 0 8px}
.typed{width:100%;min-height:112px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-weight:800;font-size:19px;line-height:1.35;resize:vertical;color:var(--text)}
.typed:focus-visible{border-color:var(--focus);outline-offset:0}
.typed[disabled]{background:var(--soft)}
.reveal-row{display:flex;justify-content:flex-end;margin:12px 0 24px}
.sc-list{list-style:none;margin:18px 0 0;padding:0}
.sc{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:2px solid var(--line)}
.sc .thumb{width:92px;height:69px;border-radius:14px}
.sc-t{font-size:18px;font-weight:900;line-height:1.2}
.sc-n{color:var(--muted);font-size:15px;margin-top:2px}
.sc .btn{margin-left:auto}
.opt{min-height:84px;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-weight:800;font-size:19px;line-height:1.2}
.opt .key{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue-t)}
.opt[aria-checked="true"] .key{border-color:var(--blue);color:var(--blue-t)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-t)}
.opt.wrong{border-color:#FF4B4B;background:var(--red-l);color:var(--red-t)}
.opt[disabled]{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.match .tile{min-height:60px;font-size:17px;line-height:1.2}
.tile.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-t)}
.tile.ok{border-color:var(--lock);color:var(--hint);background:var(--bg);opacity:.55}
.tile.bad{border-color:#FF4B4B;background:var(--red-l);color:var(--red-t)}
.l-foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--bg);border-top:2px solid var(--line)}
.foot-in{max-width:680px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:space-between}
.foot-in .btn{flex:1}
@media (min-width:600px){.foot-in .btn{flex:0 0 170px}.foot-in .btn:only-child{margin-left:auto}}
.fb{animation:rise .2s ease-out}
.fb.ok{background:var(--green-l);color:var(--green-t)}
.fb.bad{background:var(--red-l);color:var(--red-t)}
.fb-in{max-width:680px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.fb-ico{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.fb-ico .ic{width:30px;height:30px}
.fb.ok .fb-ico{color:var(--green-t)}
.fb.bad .fb-ico{color:var(--red-t)}
.fb-t{font-size:22px;font-weight:900;line-height:1.1}
.fb-a{font-size:17px;font-weight:700;margin-top:4px}
.fb .btn{grid-column:1/-1;margin-top:10px;width:100%}
@media (min-width:600px){.fb-in{grid-template-columns:auto 1fr 190px}.fb .btn{grid-column:auto;margin-top:0}}
.done-wrap{text-align:center;padding-top:28px}
.badge{width:132px;height:132px;border-radius:50%;background:#FFC800;box-shadow:0 8px 0 #E5A400;color:#fff;display:grid;place-items:center;margin:0 auto 26px}
.badge .ic{width:72px;height:72px}
.done-wrap h1{font-size:30px;font-weight:900}
.done-wrap .sub{color:var(--muted);margin-top:6px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0 0}
.st{border-radius:16px;border:2px solid var(--c);overflow:hidden;background:var(--bg)}
.st-h{display:block;background:var(--c);color:var(--ct);font-size:14px;font-weight:900;padding:6px 4px}
.st-v{display:flex;align-items:center;justify-content:center;gap:6px;min-height:64px;font-size:24px;font-weight:900;color:var(--c2)}
.st-v .ic{width:24px;height:24px}
.st.xp{--c:#E5A400;--ct:#4A3600;--c2:#8A5E00}
.st.acc{--c:#46A302;--ct:#fff;--c2:var(--green-t)}
.st.time{--c:#1899D6;--ct:#fff;--c2:var(--blue-t)}
.streak-note{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;font-weight:900;font-size:19px;color:var(--orange-t)}
.streak-note .ic{width:30px;height:30px}
.sad-heart{width:96px;height:96px;margin:0 auto 22px}
.sad-heart .ic{width:96px;height:96px}

/* ---------- guidebook ---------- */
.g-wrap{width:100%;max-width:680px;margin:0 auto;padding:4px 16px 48px}
.seg{display:flex;gap:8px;margin:6px 0 20px}
.seg button{flex:1;min-height:48px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--bg);color:var(--muted);font-weight:900;font-size:15px}
.seg button[aria-selected="true"]{border-color:var(--blue);background:var(--blue-l);color:var(--blue-t)}
.g-intro{font-size:19px;line-height:1.4}
.tip{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--tip-bg);color:var(--tip-tx);border:2px solid #FFC800;font-size:17px;line-height:1.4}
.tip b{font-weight:900}
.tbl-wrap{margin-top:18px;overflow-x:auto}
table.vt{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;font-size:16px}
.vt th,.vt td{padding:10px 12px;text-align:left}
.vt th{background:var(--soft);color:var(--muted);font-size:14px;font-weight:800}
.vt td{border-top:2px solid var(--line);font-weight:800}
.vt td:first-child{color:var(--muted);font-weight:700}
.h3{font-size:20px;font-weight:900;margin:26px 0 4px}

/* ---------- dialog + toast ---------- */
dialog{width:min(380px,calc(100% - 32px));border:2px solid var(--line);border-radius:22px;padding:24px;background:var(--bg);color:var(--text)}
dialog::backdrop{background:var(--overlay)}
dialog h2{font-size:22px;font-weight:900}
dialog p{color:var(--muted);margin-top:8px}
.dlg-btns{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:calc(100% - 32px);
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;text-align:center}
.toast[hidden]{display:none}

/* speaking */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin:30px 0 10px}
.mic{width:108px;height:108px;border-radius:50%;border:0;background:#1899D6;color:#fff;box-shadow:0 7px 0 #12749F;display:grid;place-items:center;position:relative}
.mic:active{transform:translateY(5px);box-shadow:0 2px 0 #12749F}
.mic .ic{width:50px;height:50px}
.mic.on{background:#EA2B2B;box-shadow:0 7px 0 #B71C1C}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid #EA2B2B;opacity:.5;animation:pulse 1.2s ease-out infinite}
.mic[disabled]{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--hint);cursor:default}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
.mic-state{font-weight:900;font-size:19px}
.heard{min-height:52px;text-align:center;color:var(--muted);font-size:17px;max-width:44ch;margin:0 auto}
.mic-note{color:var(--muted);font-size:14px;text-align:center;max-width:40ch;margin:14px auto 0}
.blank-sentence{font-size:25px;font-weight:800;line-height:1.6;margin:4px 0 0}
.blank{display:inline-block;min-width:104px;border-bottom:4px solid var(--blue);margin:0 2px 0 6px;height:1em;vertical-align:baseline}
.pop-top{display:flex;align-items:center;gap:14px;text-align:left}
.pop-top .thumb{width:104px;height:78px;border-radius:16px;background:#fff}
.icon-btn.accent{color:var(--blue-t)}
.top-r{display:flex;align-items:center;gap:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:2px solid var(--line);margin-top:26px}
.switch label{flex:1}
.sw-t{display:block;font-weight:900;font-size:18px}
.sw-n{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.switch input{width:32px;height:32px;accent-color:#46A302;flex:none}
/* quick glossary sheet */
#qg{padding:0;width:min(520px,calc(100% - 24px));max-height:min(80vh,680px)}
#qg[open]{display:flex;flex-direction:column}
.qg-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 0 22px}
.qg-head h2{font-size:22px;font-weight:900}
.qg-body{padding:0 22px}
.qg-count{padding:0 22px;margin:0 0 4px}
.qg-list{overflow-y:auto;padding:0 22px 12px;flex:1;min-height:140px}
.qg-foot{padding:12px 22px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
@media (max-width:600px){#qg{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;border-bottom:0}}

@media (prefers-reduced-motion:reduce){
  .mic.on::after{animation:none;opacity:.5;transform:none}
  .bubble{animation:none}
  .pop,.fb{animation:none}
  .bar-fill{transition:none}
  .btn:active,.spk:active,.node:active,.tile:active,.btn-g:active,.mic:active{transform:none}
}
</style>
</head>

<a class="skip" href="#main">Skip to main content</a>

<div class="app" id="app">

  <div class="l-body" id="l-body"></div>

</div>

<div class="overlay" id="guide" role="dialog" aria-modal="true" aria-label="Guidebook" hidden>

<script>

const GLOSS_ALL=(()=>{
  const key=g=>plain(g.es).replace(/^(el|la|los|las|un|una) /,'');
  const seen=new Set(GLOSS.map(g=>plain(g.es)));const out=GLOSS.slice();
  LESSONS.forEach(l=>l.vocab.forEach(([en,es])=>{const k=plain(es);if(!seen.has(k)){seen.add(k);out.push({c:'words',en,es})}}));
  return out.sort((a,b)=>key(a).localeCompare(key(b)));
})();

const KEY='bedside-espanol-v1';
const fresh=()=>({done:[],xp:0,streak:0,last:null,right:0,total:0,speak:true,updated:0});

try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}
/* progress: localStorage plus an IndexedDB mirror; iOS keeps both for home-screen apps */
const NB=null;
const standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let syncState=standalone?'native':'local';
const IDB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('bedside',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>rej(t.error)})},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const save=()=>{S.updated=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){};IDB.set(KEY,j).catch(()=>{})};
function merge(remote){
  if(!remote)return;
  const r=Object.assign(fresh(),remote);
  const newer=(r.updated||0)>=(S.updated||0);
  const base=newer?r:S,other=newer?S:r;
  const m=Object.assign({},base);
  m.done=[...new Set([...(S.done||[]),...(r.done||[])])];
  m.xp=Math.max(S.xp||0,r.xp||0);m.right=Math.max(S.right||0,r.right||0);m.total=Math.max(S.total||0,r.total||0);
  if((other.streak||0)>(m.streak||0)&&other.last&&(!m.last||other.last>=m.last)){m.streak=other.streak;m.last=other.last}
  S=m;
}
async function loadNative(){
  try{
    const j=await IDB.get(KEY);
    const had=JSON.stringify(S);
    if(j)merge(JSON.parse(j));
    const now=JSON.stringify(S);
    try{localStorage.setItem(KEY,now)}catch(e){}
    if(now!==j)await IDB.set(KEY,now);
    if(now!==had&&!L&&!G){render();if(view==='learn')scrollToCurrent()}
  }catch(e){}
}

function backupCode(){try{return 'BE1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return ''}}
function restoreCode(code){
  const m=String(code||'').trim().match(/^BE1\.([A-Za-z0-9+/=]+)$/);if(!m)return false;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||!Array.isArray(o.done))return false;merge(o);save();return true}catch(e){return false}
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NSR=NB&&NB.speech?NB.speech:null;
let micSupported=!!SR||!!NSR;
if(NSR&&!SR){NSR.available().then(ok=>{micSupported=!!ok;if(!ok&&view==='profile')render()}).catch(()=>{})}
const speakOn=()=>micSupported&&S.speak!==false&&Date.now()>micPause;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function say(text,rate){
  try{
    if(!('speechSynthesis' in window)){toast('Audio is not available in this browser.');return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    let vs=speechSynthesis.getVoices();if(!vs.length){speechSynthesis.onvoiceschanged=()=>{};}
    const v=vs.find(v=>/^es[-_](MX|US|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang));
    if(v)u.voice=v;
    u.lang=v?v.lang:'es-MX';u.rate=rate||0.95;
    speechSynthesis.speak(u);
  }catch(e){toast('Audio is not available in this browser.')}
}

function mkTr(p,dir,pool){

    others=others.concat(shuffle(PICPOOL.filter(([es,e])=>!names.has(es)&&!used.has(e))).slice(0,3-others.length).map(([es,e])=>[es,e,VOCEN[es]||es]));

    on?mkSpeak(g(2),p):mkTr(g(2),'en2es',p),sc[0]&&mkScen(sc[0]),mkTr(g(3),'en2es',p),b,

const digitWords={'0':'cero','1':'uno','2':'dos','3':'tres','4':'cuatro','5':'cinco','6':'seis','7':'siete','8':'ocho','9':'nueve','10':'diez'};
const sp=s=>plain(s).replace(/[¿?¡!.,;:]/g,' ').replace(/\b(10|[0-9])\b/g,m=>digitWords[m]).replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

  const used=h.map(()=>false);let m=0;
  t.forEach(w=>{const i=h.findIndex((x,j)=>!used[j]&&tokEq(x,w));if(i>=0){used[i]=true;m++}});
  return m/t.length;
}
function stopRec(){const s=L&&L.st;if(s&&s.rec){try{s.rec.onend=null;s.rec.abort()}catch(e){}s.rec=null;s.listening=false}}

const MIC_ERR={'not-allowed':'Microphone access is blocked. Allow it in your browser settings, or tap “Can’t speak now.”','service-not-allowed':'Microphone access is blocked. Allow it in your browser settings, or tap “Can’t speak now.”','audio-capture':'No microphone was found.','network':'Speech recognition needs an internet connection.','no-speech':'I did not hear anything. Tap the mic and try again.'};
function toggleMic(){
  const e=L.cur,s=L.st;if(L.checked)return;
  if(NSR&&!SR)return toggleNativeMic(e,s);

  let rec;try{rec=new SR()}catch(err){s.msg='Could not start the microphone.';renderSpeak();return}
  rec.lang='es-US';rec.interimResults=false;rec.maxAlternatives=4;rec.continuous=false;
  s.alts=[];s.err='';s.msg='';s.listening=true;s.tried=true;s.rec=rec;renderSpeak();

  rec.onerror=ev=>{s.err=ev.error||'error'};

async function toggleNativeMic(e,s){
  if(s.listening){try{await NSR.stop()}catch(err){}return}

    const matches=await NSR.listen('es-US',4);

function openQG(){
  const d=$('#qg');
  d.innerHTML='<div class="qg-head"><h2 id="qg-title">Quick glossary</h2><button type="button" class="icon-btn" data-act="qg-close" aria-label="Close glossary">'+ic('x')+'</button></div>'+
   '<div class="qg-body"><div class="field" style="margin:8px 0 10px"><label for="qgs">Search terms</label><div class="sw">'+ic('search')+'<input id="qgs" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="English or Spanish"></div></div></div>'+
   '<p class="count qg-count" id="qg-count" role="status" aria-live="polite"></p><div class="qg-list" id="qg-list"></div>'+
   ((L||G)?'':'<div class="qg-foot"><button type="button" class="btn btn-blue btn-sm" data-act="qg-full" style="width:100%">Open full glossary</button></div>');
  fillQG('');d.showModal();$('#qgs').focus();
}
function fillQG(q){
  const k=plain(q.trim());
  const rows=GLOSS_ALL.filter(g=>!k||plain(g.en).includes(k)||plain(g.es).includes(k));
  $('#qg-count').textContent=rows.length+(rows.length===1?' term':' terms');
  $('#qg-list').innerHTML=termRows(rows,q);
}

function matchTap(key){
  const e=L.cur,s=L.st;if(L.checked||s.locked||s.matched.includes(key))return;
  const side=key[0],i=+key.slice(1);
  if(side==='l')s.a=(s.a===i?null:i);else s.b=(s.b===i?null:i);
  if(s.a!==null&&s.b!==null){
    if(e.left[s.a].k===e.right[s.b].k){
      s.matched.push('l'+s.a,'r'+s.b);s.a=s.b=null;renderMatch();
      if(s.matched.length===e.pairs.length*2){L.checked=true;L.ok=true;L.done++;L.right++;L.att++;lessonTop();showFb(true,'','All matched!')}
    }else{
      s.bad=['l'+s.a,'r'+s.b];s.locked=true;renderMatch();
      setTimeout(()=>{if(L.cur!==e)return;s.bad=null;s.a=s.b=null;s.locked=false;renderMatch()},650);
    }
  }else renderMatch();
}
function outOfHearts(){
  $('#l-body').innerHTML='<div class="done-wrap"><div class="sad-heart">'+ic('broken')+'</div><h1 id="q" tabindex="-1">You ran out of hearts</h1><p class="sub">Each wrong answer costs one heart. Review the phrases and try again.</p></div>';
  $('#l-foot').innerHTML='<div class="foot-in"><button type="button" class="btn btn-ghost" data-act="quit-now">Quit lesson</button><button type="button" class="btn" data-act="retry" id="cont">Try again</button></div>';
  $('#cont').focus({preventScroll:true});
}
function finishLesson(){
  const acc=L.att?Math.round(L.right/L.att*100):100,secs=Math.max(1,Math.round((Date.now()-L.t0)/1000)),gain=(L.mode==='scen'?5:10)+(acc===100?5:0);
  S.xp+=gain;S.right+=L.right;S.total+=L.att;if(L.mode!=='scen'&&!S.done.includes(L.l.id))S.done.push(L.l.id);
  const t=dayStr();let up=false;
  if(S.last!==t){S.streak=(S.last===yesterday()?S.streak:0)+1;S.last=t;up=true}
  save();L.finished=true;
  $('#l-close').hidden=true;$('#l-hearts').hidden=true;$('#l-gloss').hidden=true;
  const time=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  $('#l-fill').style.width='100%';
  $('#l-body').innerHTML='<div class="done-wrap"><div class="badge" aria-hidden="true">'+ic('star')+'</div><h1 id="q" tabindex="-1">'+(L.mode==='scen'?'Scenarios complete!':'Lesson complete!')+'</h1><p class="sub">'+esc(L.l.title)+'</p>'+
    '<div class="stats3"><div class="st xp"><span class="st-h">Total XP</span><span class="st-v">'+ic('bolt')+gain+'</span></div>'+
    '<div class="st acc"><span class="st-h">Accuracy</span><span class="st-v">'+acc+'%</span></div>'+
    '<div class="st time"><span class="st-h">Time</span><span class="st-v">'+time+'</span></div></div>'+
    (up?'<p class="streak-note">'+ic('flame')+'<span>'+S.streak+(S.streak===1?' day':' days')+' streak</span></p>':'')+'</div>';
  $('#l-foot').innerHTML='<div class="foot-in"><button type="button" class="btn" data-act="finish" id="cont">Continue</button></div>';
  const q=$('#q');if(q)q.focus({preventScroll:true});
}
function closeLesson(){
  stopRec();
  $('#lesson').hidden=true;$('#app').inert=false;
  const id=L&&L.l.id;L=null;
  renderTop();if(view==='learn'){renderLearn();scrollToCurrent()}
  const n=id&&$('[data-node="'+id+'"]');
  if(n)n.focus({preventScroll:true});else $('#main').focus({preventScroll:true});
}
function quitAsk(){
  if(L&&L.finished){closeLesson();return}
  ask({title:'Wait, do not go!',text:'You will lose the progress you made in this lesson if you quit now.',no:'Keep learning',yes:'End lesson',onYes:closeLesson});
}

/* ================= guidebook ================= */
function openGuide(uid,from){
  const u=UNITS.find(x=>x.id===uid);opener=from||null;
  G={u,tab:0};
  $('#app').inert=true;$('#guide').hidden=false;$('#guide').scrollTop=0;
  $('#g-close').innerHTML=ic('back');
  $('#g-title').textContent=u.guide.title+' guidebook';
  renderGuide();$('#g-close').focus({preventScroll:true});
}
function renderGuide(){
  const tabs=G.u.guide.tabs,t=tabs[G.tab];
  let h='<div class="seg" role="tablist" aria-label="Guidebook sections">'+tabs.map((x,i)=>'<button type="button" role="tab" id="gt'+i+'" aria-selected="'+(i===G.tab)+'" tabindex="'+(i===G.tab?0:-1)+'" data-gtab="'+i+'">'+esc(x.label)+'</button>').join('')+'</div>'+
   '<div role="tabpanel" aria-labelledby="gt'+G.tab+'"><p class="g-intro">'+esc(t.intro)+'</p><div class="tip">'+(t.tip.includes('<b>')?t.tip:esc(t.tip))+'</div>';
  if(t.rows){
    h+='<div class="tbl-wrap"><table class="vt"><thead><tr>'+t.head.map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
      t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  h+='<h3 class="h3">Examples</h3>'+t.ex.map(x=>'<div class="term"><button type="button" class="spk" data-say="'+esc(x[0])+'" aria-label="Play '+esc(x[0])+'">'+ic('speaker')+'</button><div><p class="t-es">'+esc(x[0])+'</p><p class="t-en">'+esc(x[1])+'</p></div></div>').join('')+'</div>';
  $('#g-body').innerHTML=h;
}
function closeGuide(){
  $('#guide').hidden=true;$('#app').inert=false;G=null;
  if(opener&&document.contains(opener))opener.focus({preventScroll:true});else $('#main').focus({preventScroll:true});
}

/* ================= events ================= */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.say!==undefined){say(d.say,d.slow?0.6:0.95);return}
  if(d.tab){setTab(d.tab);return}
  if(d.node!==undefined&&t.classList.contains('node')){togglePop(t);return}
  if(d.start){openLesson(d.start,$('[data-node="'+d.start+'"]'));return}
  if(d.guide){openGuide(d.guide,t);return}
  if(d.cat){gc=d.cat;$$('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.cat===gc)));fillGlossary();return}
  if(d.gtab!==undefined){G.tab=+d.gtab;renderGuide();$('#gt'+G.tab).focus();return}
  if(t.id==='g-close'){closeGuide();return}
  if(t.id==='l-close'){quitAsk();return}
  if(d.opt!==undefined&&L&&!L.checked){L.st.sel=+d.opt;renderMC();renderFoot();if(ev.detail===0){const n=$('[data-opt="'+d.opt+'"]');if(n)n.focus()}return}
  if(d.pick!==undefined&&L&&!L.checked){L.st.chosen.push(+d.pick);renderTr();renderFoot();if(ev.detail===0){const n=$('[data-pick]');if(n)n.focus()}return}
  if(d.un!==undefined&&L&&!L.checked){L.st.chosen=L.st.chosen.filter(i=>i!==+d.un);renderTr();renderFoot();if(ev.detail===0){const n=$('[data-pick="'+d.un+'"]');if(n)n.focus()}return}
  if(d.m!==undefined&&L){matchTap(d.m);return}
  if(d.scen){openLesson(d.scen,t,'scen');return}
  if(d.hw!==undefined&&L){const i=+d.hw,on=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',String(on));L.st.hints=on?L.st.hints.concat(i):L.st.hints.filter(x=>x!==i);return}
  switch(d.act){
    case'mic':toggleMic();break;
    case'nospeak':noSpeak();break;
    case'qg':openQG();break;
    case'qg-close':$('#qg').close();break;
    case'qg-full':$('#qg').close();setTab('glossary');break;
    case'check':check(false);break;
    case'skip':check(true);break;
    case'cont':nextEx();break;
    case'finish':closeLesson();break;
    case'retry':openLesson(L.l.id,opener,L.mode);break;
    case'reveal':if(L&&!L.checked){L.st.typed=L.cur.sc.es;L.st.revealed=true;renderScen();renderFoot();$('#typed').focus()}break;
    case'quit-now':closeLesson();break;
    case'clear-gloss':gq='';gc='all';renderGlossary();break;
    case'copy-bk':{const t=$('#bk');t.select();try{navigator.clipboard?navigator.clipboard.writeText(t.value):document.execCommand('copy')}catch(e){}toast('Backup code copied.');break}
    case'restore-bk':{if(restoreCode($('#bk').value)){render();toast('Progress restored.')}else toast('That code did not work. Paste the whole code, starting with BE1.')}break;
    case'reset':ask({title:'Reset your progress?',text:'This clears your streak, XP, and finished lessons on this device.',no:'Keep my progress',yes:'Reset progress',onYes:()=>{S=fresh();save();render()}});break;
  }
});
document.addEventListener('input',ev=>{if(ev.target.id==='gs'){gq=ev.target.value;fillGlossary()}else if(ev.target.id==='qgs'){fillQG(ev.target.value)}else if(ev.target.id==='typed'&&L){L.st.typed=ev.target.value;renderFoot()}});
document.addEventListener('change',ev=>{if(ev.target.id==='sp-toggle'){S.speak=ev.target.checked;save()}});
document.addEventListener('keydown',ev=>{
  if($('#dlg').open||$('#qg').open)return;
  const lessonOpen=!$('#lesson').hidden,guideOpen=!$('#guide').hidden;
  if(ev.key==='Escape'){
    if(lessonOpen){ev.preventDefault();quitAsk()}else if(guideOpen){ev.preventDefault();closeGuide()}
    return;
  }
  if(guideOpen&&ev.target.getAttribute&&ev.target.getAttribute('role')==='tab'&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft')){
    ev.preventDefault();const n=G.u.guide.tabs.length;G.tab=(G.tab+(ev.key==='ArrowRight'?1:n-1))%n;renderGuide();$('#gt'+G.tab).focus();return;
  }
  if(!lessonOpen||!L)return;
  if(ev.target.id==='typed'){if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();if(L.checked){const c=$('#cont');if(c)c.click()}else if(canCheck())check(false)}return}
  const onBtn=ev.target.tagName==='BUTTON'||ev.target.tagName==='INPUT';
  if(L.cur&&L.cur.kind==='mc'&&!L.checked&&/^[1-4]$/.test(ev.key)&&+ev.key<=L.cur.opts.length){
    L.st.sel=+ev.key-1;renderMC();renderFoot();return;
  }
  if(ev.key==='Enter'&&!onBtn){
    if(L.checked){const c=$('#cont');if(c)c.click()}
    else if(canCheck())check(false);
  }
});

/* ================= boot ================= */
$('#qg').addEventListener('click',ev=>{if(ev.target===ev.currentTarget)ev.currentTarget.close()});
$('#qg').addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();ev.currentTarget.close()}});
renderNav();render();scrollToCurrent();
window.scrollTo(0,0);
loadNative();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
